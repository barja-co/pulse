<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500&display=swap">
<style>
:root{--bg:#000;--sf:#0d0f18;--ln:#232838;--tx:#f2f4fa;--mt:#98a0b8;--rd:#4169e1;--gr:#3560d8;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5fb;--sf:#fff;--ln:#d8dcea;--tx:#0a0f24;--mt:#56607e}}
:root[data-theme="light"]{--bg:#f3f5fb;--sf:#fff;--ln:#d8dcea;--tx:#0a0f24;--mt:#56607e}
:root[data-theme="dark"]{--bg:#000;--sf:#0d0f18;--ln:#232838;--tx:#f2f4fa;--mt:#98a0b8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Inter,system-ui,sans-serif;display:flex;justify-content:center}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--rd);outline-offset:2px}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;border-inline:1px solid var(--ln)}
main{flex:1;overflow:hidden;position:relative}
.tab{position:absolute;inset:0;overflow-y:auto;display:none}
.tab.on{display:block}
nav{display:flex;border-top:1px solid var(--ln);background:var(--bg)}
nav button{flex:1;padding:12px 4px;color:var(--mt);font-size:13px}
nav button[aria-selected=true]{color:var(--tx);box-shadow:inset 0 2px var(--rd)}
/* videos */
#feed{scroll-snap-type:y mandatory;overflow-y:auto;height:100%}
.vid{height:100%;scroll-snap-align:start;position:relative;display:flex;align-items:flex-end;padding:20px;overflow:hidden}
.vid .bg{position:absolute;inset:0}
.vid .cap{position:relative;max-width:75%;color:#fff;text-shadow:0 1px 8px #000a}
.vid .cap b{display:block;font-size:17px}
.vid .cap small{opacity:.9}
.acts{position:absolute;right:12px;bottom:24px;display:flex;flex-direction:column;gap:16px;align-items:center;color:#fff;text-shadow:0 1px 6px #000a}
.acts button{display:flex;flex-direction:column;align-items:center;font-size:12px;gap:2px;color:#fff}
.acts .ic{font-size:26px}
.acts .liked .ic{color:var(--rd)}
.top{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:2;font:700 18px 'Bricolage Grotesque';color:#fff;pointer-events:none;text-shadow:0 1px 6px #000a}
.badge{display:inline-block;background:var(--gr);color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;margin-bottom:4px}
/* shared */
.pad{padding:16px}
.hd{padding:16px 16px 8px}
.hd h2{font-size:24px}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff}
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 12px}
.stories button{flex:none;text-align:center;font-size:12px;color:var(--mt)}
.stories .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--rd);margin:4px auto 6px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:0 16px 12px}
.card h3{font-size:16px;margin-bottom:2px}
.mt{color:var(--mt);font-size:13px}
.btn{background:var(--rd);color:#fff;border-radius:8px;padding:8px 14px;font-weight:500}
.btn.alt{background:none;border:1px solid var(--ln);color:var(--tx)}
.btn.on{background:var(--gr)}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--mt)}
.tag.v{border-color:var(--gr);color:var(--gr)}
.tag.u{border-color:var(--rd);color:var(--rd)}
/* chat */
#chat{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:5}
#chat.on{display:flex}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}

<script>
const $=s=>document.querySelector(s);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* tabs */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+b.dataset.t));
 $('#chat').classList.remove('on');});
/* videos */
const vids=[
 {u:'Sample creator',t:'Olive harvest: a family tradition (sample clip)',v:1,g:'linear-gradient(160deg,#4169e1,#000)',l:1240,c:86},
 {u:'Sample creator',t:'Tatreez embroidery, stitch by stitch (sample clip)',v:0,g:'linear-gradient(160deg,#1c3fa8,#000)',l:980,c:41},
 {u:'Sample channel',t:'Daily briefing with sources in the description (sample clip)',v:1,g:'linear-gradient(160deg,#6d8cf0,#000)',l:2105,c:132},
 {u:'Sample creator',t:'Cooking maqluba for twelve (sample clip)',v:0,g:'linear-gradient(160deg,#2b3350,#000)',l:760,c:27}];
const feed=$('#feed');
vids.forEach((x,i)=>{const d=document.createElement('article');d.className='vid';
 d.innerHTML=`<div class="bg" style="background:${x.g}"></div>
 <div class="cap">${x.v?'<span class="badge">Verified source</span>':''}<b>@${esc(x.u.replace(/ /g,'_'))}</b><small>${esc(x.t)}</small></div>
 <div class="acts">

  <button data-a="com" aria-label="Comment"><span class="ic">✎</span><span>${x.c}</span></button>
  <button data-a="share" aria-label="Share"><span class="ic">↗</span><span>Share</span></button></div>`;
 d.querySelector('[data-a=like]').onclick=e=>{const b=e.currentTarget,n=b.querySelector('.n');const on=b.classList.toggle('liked');x.l+=on?1:-1;n.textContent=x.l};
 d.querySelector('[data-a=com]').onclick=()=>toast('Comments open in the full version');
 d.querySelector('[data-a=share]').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href).catch(()=>{});toast('Link copied')};
 feed.append(d)});

const people=[['Amal','#4169e1'],['Youssef','#6c7aa8'],['Lina','#1f3f9e'],['Omar','#5a7be0']];

$('#stories').onclick=e=>{const b=e.target.closest('[data-s]');if(b)toast(b.dataset.s+"'s story disappears in 24h")};
$('#chats').innerHTML=people.map(p=>`<button class="row" data-p="${p[0]}"><div class="av" style="background:${p[1]}">${p[0][0]}</div><div style="flex:1"><b>${p[0]}</b><div class="mt">${prev[p[0]]}</div></div>${p[0]==='Amal'||p[0]==='Lina'?'<span class="dot"></span>':''}</button>`).join('');
let cur=null,eph=false;
$('#chats').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;cur=b.dataset.p;const p=people.find(x=>x[0]===cur);

$('#back').onclick=()=>$('#chat').classList.remove('on');

function draw(){const f=F[cur]||{};$('#msgs').innerHTML=convo[cur].map((m,i)=>m.in?(m.media?`<div class="m"><div class="ph ${f.blurin&&!m.rev?'bl':''}" ${f.blurin&&!m.rev?`data-rev="${i}"`:''}>${f.blurin&&!m.rev?'Photo hidden · tap to view':''}</div></div>`:`<div class="m">${esc(m.t)}</div>`):`<div class="m me ${m.gone?'gone':''}">${m.gone?'Message disappeared':esc(m.t)}</div>`).join('')||'<p class="mt">No messages yet. Say hello.</p>';$('#msgs').scrollTop=1e9}
